# ThesisForge squad haritası — Sektörler.xlsx bazlı güncelleme.
#
# `metrics:` listesi sektör-spesifik anahtarlardır (NIM, CAR, refining_margin …).
# Bu anahtarlar `compute_ratios` tool'undan otomatik DÖNMEZ — sadece
# `cari_oran`, `borc_ozkaynak`, `aktif_toplam` döner. Squad'a özel anahtarlar
# `fundamental_<squad>.md` prompt'unda LLM'e checklist olarak verilir.
#
# `prompt:` dosyası diskte yoksa `sector_map.prompt_file_for_squad` otomatik
# `fundamental_generic.md`'ye düşer, sistem hata vermez.
#
# Toplam: 27 aktif squad + 1 Generic fallback = 28 squad.
#
# `ticker_overrides:` bloğu duplicate ticker'lar için squad kararını YAML
# sırasından ayırır. `squad_for_ticker()` önce buraya bakar, sonra squad
# listelerine düşer. Domain-net duplicate'ler (ör. SELEC hem Retail hem
# Healthcare listesindeyse buraya `SELEC: Healthcare` yazılır.

ticker_overrides:
  SELEC: Healthcare

