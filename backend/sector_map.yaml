# Bu anahtarlar `compute_ratios` tool'undan otomatik DÖNMEZ — sadece
# `cari_oran`, `borc_ozkaynak`, `aktif_toplam` döner. Squad'a özel anahtarlar
# `fundamental_<squad>.md` prompt'unda LLM'e checklist olarak verilir; LLM
# `get_financial_statements` ham verisinden ve `fetch_kap_filings`'den
# derivasyonla doldurur. Üretilemeyen metriği LLM `key_metrics_json`'a koymaz
