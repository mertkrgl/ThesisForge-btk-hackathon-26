[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesisforge-backend"
version = "0.1.0"
description = "ThesisForge backend — citation-grounded multi-agent BIST analysis"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    # Validation & settings
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    # DB
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    # HTTP
    "httpx>=0.27",
    # Cache & rate limit
    "cachetools>=5.4",
    "aiolimiter>=1.1",
    # Logging
    "structlog>=24.4",
    # Misc
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    # scripts/product runtime deps (mevcut venv'de zaten var ama backend bağımlılığa eklenir)
    "yfinance>=0.2.60",
    "curl_cffi>=0.7",
    "isyatirimhisse>=5.0.1",
    "borsapy",
    "pykap",
    "pandas>=2.0,<3",
    "pandas_ta>=0.4.67b0",
    "beautifulsoup4",
    "googlenewsdecoder",
    # LLM (Gemini-only; Aşama 6+)
    "strands-agents[gemini]>=1.39",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "alembic*", "fixtures*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require a running Postgres",
    "smoke: end-to-end smoke tests using real network",
]
