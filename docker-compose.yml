services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: thesisforge-postgres
    environment:
      POSTGRES_DB: thesisforge
      POSTGRES_USER: tf
      POSTGRES_PASSWORD: tf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tf -d thesisforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
